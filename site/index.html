.tech-grid,.source-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.technology-card>p{margin-top:10px;color:#526f94}.technology-card details{margin-top:15px}.technology-card>.text-action{font-size:var(--body)}.technology-card+.result-line{margin-top:28px}.source-card h2{margin:10px 0}.source-card>p{color:#526f94;margin-top:9px}.source-card>.meta{font-size:var(--meta);margin-top:14px;padding-top:12px;border-top:1px solid #e2e9f2}.criteria-list{display:grid;gap:12px}.criteria-list .panel p{margin-top:7px;color:#526f94}.source-grid .panel>p{margin-top:10px;color:#526f94}.empty{border:1px dashed #c5d4e5;border-radius:4px;padding:28px;text-align:center;color:var(--muted);font-size:var(--body);grid-column:1/-1}.empty>a{display:inline-block;margin-top:12px}.site-footer{max-width:1480px;margin:0 auto;padding:18px 30px 24px;display:flex;gap:12px 25px;justify-content:space-between;flex-wrap:wrap;color:var(--muted);font-size:var(--meta);border-top:1px solid var(--line)}
@media(max-width:1180px){.topbar{padding:14px 22px;gap:18px}.global-search{width:250px}.navstrip{padding:0 22px}.navstrip a{padding-left:15px;padding-right:15px}.app-layout{grid-template-columns:210px minmax(0,1fr)}#main{padding:26px 24px}.topic-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.filters select{max-width:250px}.field-select select{max-width:160px}}
@media(max-width:900px){.topbar{position:static;flex-wrap:wrap;gap:12px}.global-search{width:100%;max-width:none;flex-basis:100%}.field-select{margin-left:auto}.navstrip{top:0}.app-layout{display:block}.app-layout.full-width{display:block}#sidebar{border-right:0;border-bottom:1px solid var(--line);padding:8px 20px}.directory{position:static}.directory>summary{border:0;margin:0;padding:7px 4px}.directory nav{max-height:300px;overflow:auto}.directory[open]>summary{margin-bottom:8px;border-bottom:1px solid var(--line)}#main{padding:24px}.support-nav a{padding-left:10px;padding-right:10px}.navstrip{gap:6px;padding:0 16px}.primary-nav a{padding-left:12px;padding-right:12px}}

.app-layout.full-width>#sidebar{display:none}
.region-results{margin:22px 0 28px}

/* Broad uses lead to source-backed, clickable biomarker clouds. */
.category-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.category-card{display:flex;flex-direction:column;align-items:flex-start;padding:22px;background:#fff;border:1px solid var(--line);border-top:3px solid #315f99;border-radius:5px;color:var(--ink)}
.category-card:hover{border-color:#92b3dc;text-decoration:none}
.category-index{font-size:var(--meta);color:var(--muted);margin-bottom:7px}
.category-card h2{margin-bottom:8px}
.category-card>p{color:#526f94;font-size:var(--body);line-height:1.85;flex:1}
.category-card-counts{display:flex;gap:7px 12px;flex-wrap:wrap;font-size:var(--meta);color:var(--muted);margin:16px 0 12px}
.category-card>b{font-size:var(--meta);font-weight:600;color:var(--blue)}
.compact-lanes .lane-card{padding:22px}
.compact-lanes .lane-card h2{font-size:var(--section)}
.compact-lanes .lane-card>b{font-size:var(--meta);margin-top:14px}
.category-navigation{display:flex;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:20px}
.category-navigation>a{padding:9px 2px;border-bottom:3px solid transparent;font-size:var(--body);color:#627997}
.category-navigation>a.active{border-bottom-color:#2563eb;color:#174b8f;font-weight:600}
.bio-toolbar{display:flex;align-items:end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.bio-scope{display:grid;gap:5px;font-size:var(--meta);color:var(--muted)}
.bio-scope select{font-size:var(--body);background:#fff;border:1px solid #cbd9e9;border-radius:4px;padding:8px 30px 8px 10px;color:var(--ink)}
.bio-totals{font-size:var(--meta);color:var(--muted)}
.cloud-section{background:#fff;border:1px solid var(--line);border-radius:5px;padding:24px}
.cloud-heading h2{font-size:var(--section)}
.cloud-heading p{margin-top:5px}
.biomarker-cloud{position:relative;width:100%;min-height:130px;margin-top:14px}
.cloud-word{display:inline-flex;align-items:center;justify-content:center;padding:7px 9px;min-height:44px;line-height:1.5;position:absolute;font-weight:500;color:#24578e;border-radius:4px;white-space:normal;text-align:center;overflow-wrap:anywhere;transition:background-color .15s}
.cloud-word:hover{background:#edf3fb;text-decoration:none;color:#174b8f}
.cloud-word.planned-word{color:#6f829c;text-decoration:underline;text-decoration-style:dashed;text-underline-offset:5px}
.cloud-flow{display:flex;align-items:center;justify-content:center;gap:10px 14px;flex-wrap:wrap;padding:14px}
.cloud-table{margin-top:18px}
.cloud-table>summary{font-size:var(--body)}
.cloud-table-scroll{overflow-x:auto;margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:4px}
.cloud-table table{border-collapse:collapse;width:100%;font-size:var(--body);text-align:left}
.cloud-table th,.cloud-table td{padding:11px 14px;border-bottom:1px solid #e1e8f2;line-height:1.8}
.cloud-table th{font-size:var(--meta);font-weight:500;color:var(--muted);background:#f8fafc}
.cloud-table td:nth-child(3),.cloud-table td:nth-child(4){text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.marker-summary{padding:18px 22px;background:#fff;border:1px solid var(--line);border-radius:5px}
.marker-summary>details{margin-top:12px}
.marker-use{margin-bottom:18px}
.marker-use>p{margin-top:8px;color:#526f94}
.marker-use ul{margin-bottom:0;color:#526f94}
.marker-tech-grid .panel>h2{margin:9px 0}
.marker-tech-grid .panel>p{color:#526f94}
.marker-tech-grid .panel>details{margin-top:15px}
.marker-evidence-context{padding:15px 20px;background:#edf3fb;border:1px solid var(--line);border-bottom:0;border-radius:5px 5px 0 0}
.marker-evidence-context>b{font-size:var(--body);font-weight:600;color:#315b8e}
.marker-evidence-context>p{margin-top:5px;color:#526f94}
.marker-study-list>section>.study-card{border-top-left-radius:0;border-top-right-radius:0}
.legacy-themes{margin-top:12px}
.legacy-themes .tags{margin-top:7px}
@media(max-width:1100px){.category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){
 .category-grid{gap:12px}
 .category-card{padding:17px 14px}
 .category-card-counts{gap:4px 8px;margin-top:12px}
 .category-card>b{line-height:1.8}
 .category-navigation{gap:12px}
 .category-navigation>a{font-size:var(--body);padding:8px 0}
 .bio-toolbar{align-items:flex-start;gap:12px}
 .cloud-section{padding:18px 12px}
 .cloud-heading{padding:0 4px}
 .cloud-heading h2{font-size:var(--body)}
 .biomarker-cloud{margin-top:12px}
 .cloud-table th,.cloud-table td{padding:9px 10px;font-size:var(--meta)}
 .marker-summary{padding:16px}
 .marker-evidence-context{padding:14px 16px}
}

/* Source directory and biomarker hotspot methodology share one support module. */
.source-method-entry{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}
.source-method-entry p{color:#526f94;margin-top:7px}
.source-method-entry .button{flex-shrink:0}
.biomarker-method-status h2{margin-top:10px}
.biomarker-method-status p,.biomarker-method-important p{margin-top:8px;color:#526f94}
.biomarker-method-status{border-left:3px solid #315f99}
.biomarker-method-important{margin-top:18px}
.biomarker-method-details{padding-top:14px;margin-top:20px}
.biomarker-method-details>summary{font-size:var(--body);font-weight:500;min-height:30px}
.biomarker-method-details li{color:#526f94}
.biomarker-method-details p{font-size:var(--body)}
.biomarker-method-links{margin-top:26px}
@media(max-width:650px){.source-method-entry{flex-direction:column;align-items:flex-start;gap:12px}}

/* Meeting-specific word clouds, coverage comparisons and evidence selection. */
.meeting-filters{display:grid;grid-template-columns:110px 150px minmax(180px,1fr) 180px;gap:12px}
.meeting-filters label,.meeting-filters select{min-width:0;max-width:none}
.meeting-view-controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin:18px 0}
.meeting-toggle{display:flex;flex-wrap:wrap;border:1px solid #cbd8e8;border-radius:4px;background:#fff;overflow:hidden;align-items:stretch}
.meeting-toggle a{padding:8px 13px;color:#526f94;font-size:var(--body);min-height:44px;display:flex;align-items:center}
.meeting-toggle a+a{border-left:1px solid #d6e0ed}
.meeting-toggle a.active{background:#e8f0fc;color:#174b8f;font-weight:600}
.meeting-toggle a:hover{text-decoration:none;background:#f0f5fc}
.meeting-view-controls .bio-scope{margin-left:auto;display:flex;align-items:center;gap:8px}
.meeting-view-controls .bio-scope select{min-width:155px}
.meeting-source-details{margin:15px 0 20px;padding:12px 16px;background:#eaf1fb;border-left:3px solid #315f99}

<script>'use strict';
const D=JSON.parse(document.getElementById('workbench-data').textContent);
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const records=[...D.papers,...D.ada],byId=id=>records.find(r=>r.id===id),thread=id=>D.threads.find(t=>t.id===id),technology=id=>D.product_map.technologies.find(t=>t.id===id);
const paperRecords=[...D.papers,...D.ada.filter(r=>r.paper?.doi||r.paper?.pmid)];
const canonicalId=r=>r.merged_paper||r.unique_study_id||r.id;
const uniqueRecords=[...new Map(records.map(r=>[canonicalId(r),byId(canonicalId(r))||r])).values()];
let route={path:['overview'],params:new URLSearchParams()},limit=12;
const allLabel='all';
const conferenceSources=D.source_catalog.items.filter(s=>s.group==='conference');
const regionOf=s=>['CDS','CSE'].includes(s?.id)?'domestic':['ADA','EASD','IDF','ATTD'].includes(s?.id)?'international':'pending';
const regionName={domestic:'国内会议',international:'国际会议',pending:'专题待定'};
const article=r=>r.paper||{doi:r.doi,pmid:r.pmid,journal:r.journal,title:r.original_title,online_date:r.online_date};
const paperDate=r=>article(r).online_date||null;
const title=r=>r.narrative?.title||r.title_cn||r.title;
const techIds=r=>r.product_relation.links.map(l=>l.tech_id);
const topicPapers=id=>paperRecords.filter(r=>r.thread_ids.includes(id));
const topicMeetings=id=>D.ada.filter(r=>r.thread_ids.includes(id));
const topicAgenda=id=>D.topics.filter(t=>t.thread_ids.includes(id));
const sourceItem=id=>D.source_catalog.items.find(s=>s.id===id);
const pget=k=>route.params.get(k)||allLabel;
function url(path,params={}){const values={...params};if(!Object.hasOwn(values,'field')&&activeFieldId()!=='diabetes')values.field=activeFieldId();const q=new URLSearchParams(Object.entries(values).filter(([k,v])=>v&&(v!==allLabel||k==='scope')&&!(k==='field'&&v==='diabetes')));return '#/'+path+(q.size?'?'+q:'')}
function updateParams(values){const p=Object.fromEntries(route.params);for(const [k,v] of Object.entries(values)){if(!v||(v===allLabel&&k!=='scope'))delete p[k];else p[k]=v}location.hash=url(route.path.join('/'),p)}
function setRoute(){const raw=location.hash.slice(2)||'overview',at=raw.indexOf('?');route={path:decodeURI(at<0?raw:raw.slice(0,at)).split('/'),params:new URLSearchParams(at<0?'':raw.slice(at+1))};limit=12;render();window.scrollTo({top:0,behavior:'auto'})}
function section(){const p=route.path[0];if(['overview','conferences','papers','technologies','sources','criteria'].includes(p))return p;if(['source','knowledge','field-scope'].includes(p))return 'sources';if(['meeting','weekly-meetings'].includes(p))return 'conferences';if(p==='study')return pget('view')==='conference'?'conferences':'papers';return 'overview'}
function heading(name,sub,extra=''){return `<header class="page-heading"><div><p class="eyebrow">${isDiabetesField()?'糖尿病领域 · '+D.cutoff+'资料快照':esc(activeField().name)+' · 已有知识库框架'}</p><h1>${esc(name)}</h1><p class="subtitle">${esc(sub)}</p></div>${extra}</header>`}
function pill(text,kind=''){return `<span class="pill ${kind}">${esc(text)}</span>`}
function empty(text,link=''){return `<div class="empty"><p>${esc(text)}</p>${link}</div>`}
function option(value,label,selected){return `<option value="${esc(value)}" ${value===selected?'selected':''}>${esc(label)}</option>`}
function selectFilter(key,label,options){return `<label>${label}<select data-filter="${key}">${option(allLabel,'全部',pget(key))}${options.map(([id,name])=>option(id,name,pget(key))).join('')}</select></label>`}
function matches(r){const q=(route.params.get('q')||'').trim().toLowerCase();return !q||JSON.stringify(r).toLowerCase().includes(q)}
function commonMatch(r){return biomarkerRecordFilter(r)&&matches(r)&&(pget('topic')===allLabel||r.thread_ids.includes(pget('topic')))&&(pget('tech')===allLabel||techIds(r).includes(pget('tech')))}
function topicSelect(){return selectFilter('category','研究用途',BIO.categories.map(c=>[c.id,c.name]))}
function techSelect(){return selectFilter('tech','技术',D.product_map.technologies.map(t=>[t.id,t.name]))}
function sourceLink(s){return `<a href="${url('source/'+s.id)}">${esc(s.name)} →</a>`}
function externalLinks(links){return links.filter(l=>/^https?:\/\//.test(l.url||'')).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label)} ↗</a>`).join('')}
function originalLinks(r,view){if(view==='paper'){const a=article(r);return externalLinks([...(a.doi?[{label:'期刊原文',url:'https://doi.org/'+a.doi}]:[]),...(a.pmid?[{label:'PubMed摘要',url:'https://pubmed.ncbi.nlm.nih.gov/'+a.pmid+'/'}]:[])])}return externalLinks(r.sources||[{label:'会议来源',url:r.url}])}
function studyUrl(r,view){return url('study/'+r.id,{view})}
function legacyTopicLinks(r){return `<div class="tags">${r.thread_ids.map(id=>`<a href="${url('topic/'+id)}">${esc(thread(id)?.name||id)}</a>`).join('')}</div>`}
function matchingBlock(r,expanded=false){const links=r.product_relation.links;return `<section class="matching"><h3>${links.length?'吉因加产品与技术匹配':'研究启发与后续问题'}</h3>${links.length?`<div class="tags">${links.map(l=>`<a href="${url('technologies',{tech:l.tech_id})}">${esc(technology(l.tech_id).name)} · ${l.relation==='direct'?'直接技术关联':'方法参考'}</a>`).join('')}</div>`:''}<p>${esc(r.narrative?.focus||r.why||r.product_relation.reason)}</p>${links.length?`<details ${expanded?'open':''}><summary>查看匹配依据与适配状态</summary>${links.map(l=>`<div class="fit-detail"><b>${esc(technology(l.tech_id).name)}</b><p>${esc(l.basis)}</p><p>${esc(technology(l.tech_id).status)}</p><p class="meta">${esc(l.fit_status)}</p></div>`).join('')}</details>`:''}</section>`}
function studyCard(r,view,options={}){const a=article(r),isPaper=view==='paper',date=isPaper?paperDate(r):r.conference_abstract_date||r.source_date;return `<article class="study-card" data-study="${r.id}" data-line="${view}"><div class="meta-row"><span>${esc(date||'在线日期待核')}</span><span>${esc(isPaper?a.journal:r.conference+' · '+r.code)}</span>${pill(isPaper?r.reading_level:r.evidence_level,r.has_results===false?'pending':'')}</div>${isPaper&&options.showStage?paperEvidenceBlock(r):''}<h2><a href="${studyUrl(r,view)}">${esc(title(r))}</a></h2><div class="narrative">${r.narrative.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}</div>${options.hideMatching?'':matchingBlock(r)}${topicLinks(r)}<details class="evidence"><summary>${isPaper?'研究设计、结果与原始论文':'具体议题、研究状态与来源'}</summary>${isPaper?'':`<p><b>已存会议记录题目：</b>${esc(r.title||r.topic)} · ${esc(r.code)}</p>`}<p><b>研究设计：</b>${esc(r.design)}</p><p><b>关键结果：</b>${esc(r.result)}</p><p><b>读取层次：</b>${esc(r.reading_level)}</p><div class="links">${originalLinks(r,view)}</div></details><div class="card-bottom"><a href="${studyUrl(r,view)}">查看研究与团队 →</a>${isPaper&&r.entity_kind==='ada'?`<a href="${studyUrl(r,'conference')}">关联会议记录 →</a>`:''}${!isPaper&&(r.paper||r.merged_paper)?`<a href="${studyUrl(byId(r.merged_paper)||r,'paper')}">对应论文 →</a>`:''}</div></article>`}
function agendaCard(t){return `<article class="study-card agenda-card" data-agenda="${t.code}"><div class="meta-row">${pill('计划议题','pending')}<span>CDS 2026 · ${esc(t.date)} ${esc(t.time)}</span></div><h2>${esc(t.research_question)}</h2><p>${esc(t.people.map(x=>x.name.replace(/\s/g,'')+' · '+x.institution).join('；'))}</p><p class="meta">题目提及的方法：${esc(t.technology_from_title_or_pending)}</p><details><summary>展开原始议题与链接</summary><p><b>报告题目：</b>${esc(t.title)}</p><p>${esc(t.session)} · ${esc(t.room)}</p><div class="links">${externalLinks([{label:'官方议程',url:t.source_url},...t.people.filter(p=>p.profile_url).map(p=>({label:p.name.replace(/\s/g,'')+'讲者页',url:p.profile_url}))])}</div><p class="meta">当前为计划安排，报告结果待采集。</p></details><div class="tags">${t.thread_ids.map(id=>`<a href="${url('topic/'+id)}">${esc(thread(id)?.name)}</a>`).join('')}</div><section class="agenda-match"><b>后续研究与技术匹配</b><p>围绕“${esc(t.research_question)}”继续补充摘要与对应论文，明确样本、检测对象及可参与的研究环节。</p></section></article>`}
function topicCard(t){const p=topicPapers(t.id),m=topicMeetings(t.id),a=topicAgenda(t.id),ids=[...new Set([...p,...m].flatMap(techIds))];return `<article class="topic-card" data-topic="${t.id}"><div class="meta-row">${pill('追踪主题')}<span>${t.id}</span></div><h2><a href="${url('topic/'+t.id)}">${esc(t.name)}</a></h2><p>${esc(t.why)}</p><div class="topic-counts"><a href="${url('topic/'+t.id,{tab:'meetings'})}">会议研究 ${m.length}</a><a href="${url('topic/'+t.id,{tab:'papers'})}">论文证据 ${p.length}</a>${a.length?`<span>计划议题 ${a.length}</span>`:''}</div>${ids.length?`<p class="meta">关联技术：${ids.map(id=>esc(technology(id).name)).join('、')}</p>`:''}<a class="text-action" href="${url('topic/'+t.id)}">对照两条主线与技术匹配 →</a></article>`}
function legacyOverviewPage(){const topics=D.threads.filter(matches);return heading('糖尿病研究热点','从会议发现研究动向，从论文解析研究进展，围绕同一主题连接团队与技术。')+`<section class="discovery-lanes" aria-label="两条研究主线"><a class="lane-card" href="#/conferences"><span class="lane-kicker">研究主线一</span><h2>会议研究</h2><p>从国内外主要会议出发，看团队正在研究什么。</p><div class="lane-evidence"><span>ADA ${D.ada.length}条关联研究</span><span>CDS ${D.topics.length}条计划议题</span></div><b>查看会议动向 →</b></a><a class="lane-card" href="#/papers"><span class="lane-kicker">研究主线二</span><h2>论文研究</h2><p>从原始论文出发，看技术如何应用、证据推进到哪一步。</p><div class="lane-evidence"><span>${paperRecords.length}条论文证据</span><span>含${paperRecords.filter(r=>r.entity_kind==='ada').length}条会议关联论文</span></div><b>查看论文进展 →</b></a></section><section class="section-heading"><div><h2>围绕研究主题，汇合两条主线</h2><p>选择主题，对照会议动向、论文进展与吉因加技术匹配。</p></div><span class="meta">${topics.length}个追踪主题</span></section><div class="topic-grid">${topics.map(topicCard).join('')||empty('没有匹配的主题，请调整搜索词。')}</div><p class="scope-note">主题沿用已有18项归并，展示重点继续校准。现有研究按同研究版本合并为${uniqueRecords.length}条；趋势图将在可比历史基线建立后接入。</p>`}
function legacyConferencesPage(){const conf=pget('conference'),region=pget('region'),selected=sourceItem(conf);let studies=D.ada.filter(commonMatch),agendas=D.topics.filter(t=>biomarkerAgendaFilter(t)&&matches(t)&&(pget('topic')===allLabel||t.thread_ids.includes(pget('topic'))));if(region==='domestic'){studies=[]}if(region==='international'){agendas=[]}if(conf!==allLabel){if(conf!=='ADA')studies=[];if(conf!=='CDS')agendas=[]}const eligibleSources=conferenceSources.filter(s=>region===allLabel||regionOf(s)===region);return heading('会议研究','按国内与国际会议发现议题、团队和研究动向，再进入具体主题。')+`<div class="line-context"><span>会议主线</span><a href="${url('sources',{group:'conference'})}">查看会议来源 →</a></div><div class="filters">${selectFilter('region','会议来源',[['domestic','国内会议'],['international','国际会议']])}${selectFilter('conference','会议',eligibleSources.map(s=>[s.id,s.name]))}${topicSelect()}</div>${selected?`<div class="source-note"><b>${esc(selected.name)}</b><p>${esc(selected.note)}</p>${sourceLink(selected)}</div>`:''}<div class="result-line" aria-live="polite"><b>${studies.length}条研究记录 · ${agendas.length}条计划议题</b><a href="${url('criteria',{section:'hotspots'})}">热点判断标准 →</a></div>${studies.length?`<section class="region-results"><div class="section-heading"><h2>国际会议关联研究</h2><span class="meta">ADA · ${studies.length}条</span></div><div class="study-list">${studies.slice(0,limit).map(r=>studyCard(r,'conference')).join('')}</div></section>`:''}${agendas.length?`<section class="region-results"><div class="section-heading"><h2>国内会议研究议题</h2><span class="meta">CDS · ${agendas.length}条计划安排</span></div><div class="study-list">${agendas.slice(0,limit).map(agendaCard).join('')}</div></section>`:''}${!studies.length&&!agendas.length?empty('当前筛选尚无已存研究。可查看该来源的采集计划，或切换会议。',selected?sourceLink(selected):''):''}${studies.length>limit||agendas.length>limit?'<button class="button secondary load-more" data-more>显示更多研究与议题</button>':''}<details class="coverage-note"><summary>查看当前会议覆盖范围</summary><p>目前研究内容来自ADA及CDS计划议程。CSE为既有补充，EASD、IDF、ATTD等保留来源入口与采集缺口。会议所在地与团队所在地分别理解，团队归属按原始作者单位核实。</p></details>`}
function legacyPapersPage(){const journal=pget('journal'),rows=paperRecords.filter(r=>commonMatch(r)&&(journal===allLabel||article(r).journal===journal)).sort((a,b)=>(paperDate(b)||'').localeCompare(paperDate(a)||''));const journals=[...new Set(paperRecords.map(r=>article(r).journal))].sort();return heading('论文研究','独立追踪期刊原始研究：团队、问题、方法、发现与验证。')+`<div class="line-context"><span>论文主线</span><a href="${url('sources',{group:'journal'})}">查看期刊来源 →</a></div><div class="filters">${selectFilter('journal','期刊',journals.map(s=>[s,s]))}${topicSelect()}${techSelect()}</div><div class="result-line" aria-live="polite"><b>${rows.length}条论文证据</b><a href="#/criteria">文章相关性标准 →</a></div><p class="scope-note">按已核论文在线日期排序，日期待核的记录单列在后。会议关联论文在两条主线间互相链接，证据层次按实际读取范围保留。</p><div class="study-list">${rows.slice(0,limit).map(r=>studyCard(r,'paper')).join('')||empty('当前筛选没有论文，请调整主题、期刊或技术。')}</div>${rows.length>limit?'<button class="button secondary load-more" data-more>显示更多论文</button>':''}`}
function topicPage(id){const t=thread(id);if(!t)return missingPage();const tab=['meetings','papers','matching'].includes(pget('tab'))?pget('tab'):'meetings',p=topicPapers(id),m=topicMeetings(id),a=topicAgenda(id),pool=[...new Map([...p,...m].map(r=>[canonicalId(r),r])).values()],ids=[...new Set(pool.flatMap(techIds))];let body='';if(tab==='meetings')body=`<div class="study-list">${m.map(r=>studyCard(r,'conference')).join('')}${a.map(agendaCard).join('')}${!m.length&&!a.length?empty('该主题当前尚无已存会议证据。',`<a href="${url('topic/'+id,{tab:'papers'})}">查看论文进展 →</a>`):''}</div>`;if(tab==='papers')body=`<div class="study-list">${p.map(r=>studyCard(r,'paper')).join('')||empty('该主题当前尚无已存正式论文。',`<a href="${url('topic/'+id)}">查看会议动向 →</a>`)}</div>`;if(tab==='matching')body=`<div class="tech-grid">${ids.map(techCard).join('')||empty('具体技术承接环节仍待明确，可从已有研究问题继续核对。')}</div>${pool.filter(r=>r.product_relation.links.length).map(r=>`<article class="panel"><h2>${esc(title(r))}</h2>${matchingBlock(r,true)}</article>`).join('')}`;return heading(t.name,'同一研究主题，汇合会议动向、论文进展与公司技术匹配。',`<a class="button secondary" href="#/overview">返回领域总览</a>`)+`<section class="topic-intro"><h2>为什么关注</h2><p>${esc(t.why)}</p><details><summary>查看当前证据与待补问题</summary><p>${esc(t.boundary)}</p><p>当前记录状态：${esc(t.status)}。后续按判断标准复核主题定义及关注变化。</p></details></section><nav class="content-tabs" aria-label="主题研究视图">${[['meetings','会议动向',m.length+a.length],['papers','论文进展',p.length],['matching','吉因加技术匹配',ids.length]].map(([key,name,n])=>`<a class="${tab===key?'active':''}" href="${url('topic/'+id,{tab:key})}" ${tab===key?'aria-current="page"':''}>${name} <span>${n}</span></a>`).join('')}</nav>${body}`}
function studyPage(id){const r=byId(id);if(!r)return missingPage();const view=r.entity_kind==='paper'||pget('view')==='paper'?'paper':'conference';if(view==='paper'&&r.entity_kind==='ada'&&!r.paper)return missingPage();const a=article(r);return heading(title(r),view==='paper'?'论文研究 · '+a.journal:'会议研究 · '+r.conference+' · '+r.code,`<a class="button secondary" href="${view==='paper'?'#/papers':'#/conferences'}">返回${view==='paper'?'论文':'会议'}研究</a>`)+`<article class="panel research-detail"><div class="meta-row">${pill(r.id)}${pill(view==='paper'?r.reading_level:r.evidence_level)}<span>${esc(view==='paper'?paperDate(r)||'论文在线日期待核':r.source_date||r.online_date||'来源日期待核')}</span></div><div class="narrative">${r.narrative.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}</div><section class="detail-section"><h2>研究团队</h2><p>${esc(r.team)}</p></section>${matchingBlock(r,true)}<section class="detail-section"><h2>研究设计与结果</h2><dl><dt>研究设计</dt><dd>${esc(r.design)}</dd><dt>主要结果</dt><dd>${esc(r.result)}</dd><dt>局限与适用范围</dt><dd>${esc(r.limits)}</dd><dt>实际读取层次</dt><dd>${esc(r.reading_level)}</dd></dl></section><section class="detail-section"><h2>${view==='paper'?'原始论文':'会议记录与来源'}</h2><p>${esc(view==='paper'?a.title:r.title)} ${view==='paper'?'':esc(r.code)}</p><div class="links">${originalLinks(r,view)}</div></section><section class="detail-section"><h2>在两条主线间继续查看</h2><div class="links">${r.entity_kind==='ada'&&(r.paper||r.merged_paper)?`<a href="${studyUrl(byId(r.merged_paper)||r,'paper')}">对应论文 →</a><a href="${studyUrl(r,'conference')}">会议记录 →</a>`:''}${r.entity_kind==='paper'?(r.ada_source_ids||[]).map(id=>`<a href="${studyUrl(byId(id),'conference')}">关联ADA记录 ${id} →</a>`).join(''):''}</div>${topicLinks(r)}</section></article>`}
function techCard(id){const t=typeof id==='string'?technology(id):id;return `<article class="panel technology-card"><h2><a href="${url('technologies',{tech:t.id})}">${esc(t.name)}</a></h2><p>${esc(t.scope)}</p><details><summary>公司能力依据与适配范围</summary><p>${esc(t.status)}</p><p>${esc(t.boundary)}</p><p class="meta">能力底表编号：${esc(t.capability_ids.join('、'))}</p></details><a class="text-action" href="${url('papers',{tech:t.id})}">查看相关论文 →</a></article>`}
function technologiesPage(){const id=pget('tech'),t=technology(id),rows=t?uniqueRecords.filter(r=>techIds(r).includes(id)&&matches(r)):[];return heading(t?t.name+' × 糖尿病研究':'产品与技术','从检测技术反向查看相关主题、会议研究与论文证据。')+(t?techCard(t)+`<div class="result-line"><b>${rows.length}条关联研究</b><a href="${url('papers',{tech:id})}">在论文主线查看 →</a></div><div class="study-list">${rows.map(r=>studyCard(r,r.entity_kind==='paper'||r.paper?'paper':'conference')).join('')||empty('当前尚无已存关联研究，保留来源与后续采集入口。')}</div>`:`<div class="tech-grid">${D.product_map.technologies.map(techCard).join('')}</div>`)}
function sourcesPage(){if(pget('section')==='biomarker')return biomarkerStandardsPage();const group=pget('group'),status=pget('status'),rows=D.source_catalog.items.filter(s=>(group===allLabel||s.group===group)&&(status===allLabel||s.status===status)&&matches(s));return heading('信息来源','会议与论文分别采集，共同服务领域研究；来源状态按实际覆盖显示。')+sourceMethodNavigation(false)+`<section class="panel source-method-entry"><div><h2>词云热点评分标准</h2><p>了解词条如何入选、热点如何分级，以及词云大小与去重口径。</p></div><a class="button secondary" href="#/sources?section=biomarker">查看标准 →</a></section><div class="filters">${selectFilter('group','来源类别',Object.entries(D.source_catalog.groups))}${selectFilter('status','采集状态',Object.entries(D.source_catalog.status_labels))}</div><div class="result-line"><b>${rows.length}项来源及待定入口</b><span class="meta">目录整理：2026-11-11</span></div><div class="source-grid">${rows.map(s=>`<article class="panel source-card" data-source="${s.id}"><div class="meta-row">${pill(D.source_catalog.groups[s.group])}${pill(D.source_catalog.status_labels[s.status],s.status==='planned'?'pending':'')}</div><h2>${sourceLink(s)}</h2><p>${esc(s.focus)}</p><p class="meta">${esc(s.note)}</p></article>`).join('')||empty('没有匹配的来源，请调整筛选。')}</div>`}
function sourcePage(id){const s=sourceItem(id);if(!s)return missingPage();return heading(s.name,'信息来源 · '+D.source_catalog.groups[s.group],`<a class="button secondary" href="${url('sources',{group:s.group})}">返回来源分类</a>`)+`<article class="panel"><div class="meta-row">${pill(D.source_catalog.status_labels[s.status])}</div><p>${esc(s.focus)}</p><section class="detail-section"><h2>从这里获取什么</h2><ul>${s.extract.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><section class="detail-section"><h2>整理成什么</h2><ul>${s.outputs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><section class="detail-section"><h2>当前状态与原始入口</h2><p>${esc(s.note)}</p><div class="links">${externalLinks(s.links)}</div>${!s.links.length?'<p class="meta">具体会议、厂商或官方入口待确定。</p>':''}<p class="meta">沿用已存链接与采集状态，本版建设期间未访问外站核验。</p></section><section class="detail-section"><h2>进入研究主线</h2><div class="links">${s.group==='conference'?`<a href="${url('conferences',{conference:s.id})}">查看会议研究 →</a>`:'<a href="#/papers">查看论文研究 →</a>'}</div></section></article>`}

 <div class="source-grid biomarker-method-dimensions">${c.hotspot_dimensions.map(([name,question,evidence])=>`<article class="panel"><h2>${esc(name)}</h2><p>${esc(question)}</p><p class="meta">需保留：${esc(evidence)}</p></article>`).join('')}</div>
 <p class="scope-note">评价单位是“指标或组合＋人群＋用途”，例如“尿液MALAT1用于DKD与NDKD鉴别”。传统指标的新用途也可形成研究进展；文中作为常规终点反复出现，需要单独识别。</p>
 <section class="section-heading"><h2>热点状态怎么定</h2></section>
 <div class="source-grid biomarker-method-levels">${c.hotspot_levels.slice(0,3).map(([name,basis,next])=>`<article class="panel"><h2>${esc(name)}</h2><p>${esc(basis)}</p><p class="meta">下一步：${esc(next)}</p></article>`).join('')}</div>
 <section class="panel biomarker-method-important"><h2>重要进展 · 独立附加标记</h2><p>${esc(c.hotspot_levels[3][1])}。单项研究也可标为重要进展，需给出参照、具体增量及复核依据。</p><p class="meta">重要进展可与上述状态并存。热点关注度与证据成熟度分别展示；多次出现或公司技术相关均不足以单独认定热点。</p></section>
 <details class="coverage-note biomarker-method-details"><summary>词条如何入选：从资料提取到候选池</summary><ol><li>连接糖尿病的具体临床科研问题，明确人群、疾病阶段及用途。</li><li>原资料明确出现检测对象或指标，记录样本、组分、平台与研究角色；未列全成员时保留原组合或特征名称。</li><li>关联研究ID、原始链接、读取层次、实际发现和待核项，再归入早期识别、分型与预测、动态监测或其他。</li></ol><p>常规参照、疗效终点、机制分子、候选标志物及计划议题分别记录。阴性、无增益和冲突结果同样保留。</p></details>
 <details class="coverage-note biomarker-method-details"><summary>词云如何计数：大小、颜色与去重</summary><ul><li>领域总览的用途词云：字号按当前分类的去重研究记录数编码；仅有计划议题的词条用灰色虚线，计0项研究。同一词条可归入多类，各类数量不直接相加。</li><li>会议研究词云：同一位置只显示一张词云，按会议或材料类型切换。选ADA默认显示研究记录，选CDS默认显示计划议题；两类材料分别统计。研究层字号按去重研究记录数，计划层字号按议题数；计划虚线仅表示安排，不能折算为研究结果。</li><li>论文研究词云：同一框内切换研究议题/Biomarker，仅按当前正式论文范围的去重研究数计字号。在线日期待核可包含并单列或排除；时间窗只用已核在线日。研究类型与验证阶段按已有设计和局限标注，不能单凭正式发表认定研究成熟。</li><li>同一研究的会议摘要、预印本与正式论文关联为版本。当前A01/R03合并计1项，会议词云只取A01会议记录，论文独有词条不自动加入。</li><li>会议及论文的Biomarker词云颜色表示文献技术关联、方法参考或承接待确认；颜色当前不编码热点等级。议题词云用统一蓝色，计划议题用虚线。</li><li>共享队列、主研究与亚组关系需单独核对；记录数不代表独立团队数或独立验证数。</li></ul><p>当前字号只反映已收录资料分布，不能据此给全领域热度排名。HbA1c、TIR等常规参照与终点可通过“词条范围”切换查看。</p><p>会议对照在同年份、用途、搜索和词条范围下核对覆盖。当前研究层仅有ADA、计划层仅有CDS，跨会共同关注、集中度和独有线索仍待同层资料补齐；两层间只展示研究议题关联。</p></details>
 <details class="coverage-note biomarker-method-details"><summary>什么情况下可以说“升温”</summary><p>先固定来源范围、检索和纳入规则、主题定义、日期及去重方法，再比较覆盖可比的时间窗口。论文可试行相邻90天；会议优先比较同一会议相邻届次，并考虑会议周期与发表滞后。</p><p>需同时核对独立研究、团队及研究增量。当前历史基线不足，趋势保留“待判断”；扩充资料覆盖记录为“本轮新收录”。</p></details>
 <details class="coverage-note biomarker-method-details"><summary>判读示例与每次复核应留下什么</summary><p>以下示例说明规则，尚未替代逐主题热点复核：MALAT1目前关联一项尿液RNA研究，可作为候选线索追踪；EV蛋白特征先补完整结果；HGF保留机制线索身份；HbA1c/TIR按常规参照或终点用途解释。</p><p>每次复核记录：具体问题、评议时间及覆盖范围、四维判断、独立研究与团队、同研究版本、反向证据、主题状态与理由、证据成熟度、趋势及缺口、复核人和日期。吉因加适配另列，用于安排业务跟进。</p></details>
 <div class="links biomarker-method-links"><a href="#/criteria?section=hotspots">查看完整热点判断口径 →</a><a href="#/criteria?section=relevance">文章相关性 →</a><a href="#/criteria?section=fit">公司适配 →</a><a href="#/overview">返回四类词云入口 →</a></div><p class="scope-note">依据：${esc(c.source)}（${esc(c.source_updated)}），并补充本次词云判读约定。科研资料截止${D.cutoff}；本页补充标准，本次无新增采集或批量评级。</p>`;

/* Conference views use meeting records only. Paper evidence remains in its own line. */
const meetingLayerNames={research:'研究记录',agenda:'计划议题'};
function meetingView(){return pget('cloud')==='topics'?'topics':'biomarkers'}
function meetingMaterial(){const requested=pget('material');if(['research','agenda'].includes(requested))return requested;if(pget('conference')==='CDS'||pget('region')==='domestic')return 'agenda';if(pget('conference')==='ADA')return 'research';const pool=meetingRecordPool();return !pool.research.length&&pool.agenda.length?'agenda':'research'}
function meetingYear(r){return String(r.conference||r.date||'').match(/20\d{2}/)?.[0]||'pending'}
function meetingParams(changes={}){const p={...Object.fromEntries(route.params),...changes};for(const k of Object.keys(p))if(!p[k]||(p[k]===allLabel&&k!=='scope'))delete p[k];return p}
function meetingUrl(changes={}){return url('conferences',meetingParams(changes))}
function conferenceFilterChanges(key,value){const changes={biomarker:allLabel,meeting_topic:allLabel};if(key==='region'){changes.conference=allLabel;changes.material=allLabel;}if(key==='conference')changes.material=allLabel;return changes}
function meetingLink(id,extra={}){return meetingUrl({conference:id,region:allLabel,biomarker:allLabel,meeting_topic:allLabel,...extra})}
function meetingItemMatches(r,layer){if(matches(r))return true;return BIO.entries.some(e=>matches(e)&&(layer==='research'?markerRecordKeys(e,pget('category')).has(canonicalId(r)):markerAgendas(e,pget('category')).some(a=>a.code===r.code)))}
function meetingRecordPool({baseline=false}={}){
 const category=pget('category'),year=pget('year'),legacyTopic=pget('topic'),tech=pget('tech');
 let research=D.ada.filter(r=>(year===allLabel||meetingYear(r)===year)&&meetingItemMatches(r,'research')&&(!bioCategory(category)||meetingRecordCategory(r,category))&&(legacyTopic===allLabel||r.thread_ids.includes(legacyTopic))&&(tech===allLabel||techIds(r).includes(tech)));
 let agenda=D.topics.filter(r=>(year===allLabel||meetingYear(r)===year)&&meetingItemMatches(r,'agenda')&&(!bioCategory(category)||meetingAgendaCategory(r,category))&&(legacyTopic===allLabel||r.thread_ids.includes(legacyTopic)));
 research=translationFilterRows(research,'research');agenda=translationFilterRows(agenda,'agenda');
 if(!baseline){const region=pget('region'),conf=pget('conference');if(region==='domestic')research=[];if(region==='international')agenda=[];if(conf!==allLabel){if(conf!=='ADA')research=[];if(conf!=='CDS')agenda=[]}}
 return {research,agenda};
}
function meetingRecordCategory(r,category){const entries=matchingEntriesForRecord(r),cats=entries.flatMap(e=>markerBindings(e).filter(b=>canonicalId(byId(b.record_id))===canonicalId(r)).flatMap(b=>b.categories));return cats.length?cats.includes(category):category==='other'}
function meetingAgendaCategory(r,category){const cats=BIO.entries.flatMap(e=>e.agendas.filter(a=>a.code===r.code).flatMap(a=>a.categories));return cats.length?cats.includes(category):category==='other'}
function meetingUnique(rows,layer){return [...new Map(rows.map(r=>[layer==='research'?canonicalId(r):r.code,r])).values()]}
function meetingWords(rows,layer,view=meetingView()){
 const items=meetingUnique(rows,layer),category=pget('category');
 if(view==='topics')return D.threads.map(t=>({id:t.id,label:t.name,kind:'研究议题',type:'topic',entry:t,items:items.filter(r=>r.thread_ids.includes(t.id)),fit:'topic'})).filter(t=>t.items.length);
 return BIO.entries.map(e=>{const keys=markerRecordKeys(e,category),agendas=markerAgendas(e,category),fit=e.matches.some(x=>x.relation==='direct')?'direct':e.matches.length?'related':'pending';return {id:e.id,label:e.label,kind:e.kind,type:'biomarker',entry:e,fit,items:items.filter(r=>layer==='research'?keys.has(canonicalId(r)):agendas.some(a=>a.code===r.code))}}).filter(e=>e.items.length&&translationWordMatch(e,layer));
}
function meetingSelectedWord(){return meetingView()==='topics'?thread(pget('meeting_topic')):biomarker(pget('biomarker'))}
function meetingWordHref(word,layer){return meetingUrl({material:layer,biomarker:word.type==='biomarker'?word.id:allLabel,meeting_topic:word.type==='topic'?word.id:allLabel})}
function meetingSelectRows(rows,layer){const selected=meetingSelectedWord();if(!selected)return rows;const word=meetingWords(rows,layer).find(w=>w.id===selected.id);return word?rows.filter(r=>word.items.some(i=>layer==='research'?canonicalId(i)===canonicalId(r):i.code===r.code)):[]}
function meetingCloud(layer,rows){
 const conference=sourceItem(pget('conference')),conferenceName=conference?.id==='ADA'?'ADA':conference?.id==='CDS'?'CDS':conference?.name||'全部已收录会议',layerSource=rows.length?(layer==='research'?'ADA':'CDS'):'暂无材料';const words=meetingWords(rows,layer),max=Math.max(1,...words.map(w=>w.items.length)),covered=new Set(words.flatMap(w=>w.items.map(r=>layer==='research'?canonicalId(r):r.code))),total=meetingUnique(rows,layer).length,selected=meetingSelectedWord(),unit=layer==='research'?'项去重研究记录':'条计划议题',name=meetingView()==='topics'?'研究议题':'Biomarker';
 return `<section class="cloud-section meeting-cloud-section" data-layer="${layer}" aria-label="${meetingLayerNames[layer]}${name}词云"><div class="meeting-cloud-heading"><div><div class="meta-row">${pill(meetingLayerNames[layer],layer==='agenda'?'pending':'')}<span>当前来源：${esc(layerSource)} · ${words.length}个词条 · ${total}${unit}</span></div><h2>${esc(conferenceName)} · ${name}词云</h2></div><a href="#/sources?section=biomarker">判读标准 →</a></div><p class="meta">${layer==='research'?'字号按本层去重研究记录数显示；含结果待核记录，实际状态见下方研究。':'虚线表示计划议题，字号按本层议题数显示；报告结果待补，不与研究记录合并计数。'}</p>${words.length?`<div class="biomarker-cloud conference-cloud" role="group" aria-label="点击词条筛选${meetingLayerNames[layer]}">${words.map(w=>{const n=w.items.length,font=n===1?18:18+Math.round(12*Math.log2(n)/Math.log2(Math.max(2,max))),fitName=w.fit==='direct'?'文献技术关联':w.fit==='related'?'方法参考':w.fit==='topic'?'研究议题':'承接待确认';return `<a class="cloud-word conference-word fit-${w.fit} ${layer==='agenda'?'agenda-word':''} ${selected?.id===w.id?'selected-word':''}" href="${meetingWordHref(w,layer)}" data-conference-word="${w.id}" data-count="${n}" style="font-size:${font}px" title="${esc(w.label)} · ${n}${unit} · ${esc(w.kind)} · ${fitName} · ${esc(translationWordNote(w,layer))}" aria-label="${esc(w.label)}，${n}${unit}，${fitName}" ${selected?.id===w.id?'aria-current="true"':''}>${esc(w.label)}</a>`}).join('')}</div>`:empty(meetingView()==='biomarkers'?'当前材料中尚无已整理的Biomarker词条，可切换研究议题或调整筛选。':'当前筛选尚无已归类议题。')}
 <p class="meta meeting-cloud-coverage">${covered.size}/${total}${layer==='research'?'项研究记录':'条计划议题'}已关联本视图词条${total>covered.size?`，另有${total-covered.size}条尚未关联；全部原记录保留在下方`:''}。</p>
 ${words.length?`<details class="meeting-word-list"><summary>按列表查看词条与计数</summary><div class="meeting-word-chips">${words.map(w=>`<a href="${meetingWordHref(w,layer)}" data-conference-word="${w.id}">${esc(w.label)} <span>${w.items.length}</span></a>`).join('')}</div></details>`:''}</section>`;
}
function meetingCoverageCards(baseline){
 const counts=[['ADA','research',baseline.research],['CDS','agenda',baseline.agenda]];
 return `<div class="meeting-coverage-grid">${counts.map(([id,layer,rows])=>{const words=meetingWords(rows,layer);return `<a class="meeting-coverage-card ${pget('conference')===id?'active':''}" href="${meetingLink(id,{material:layer})}"><b>${id} · ${meetingLayerNames[layer]}</b><p>${meetingUnique(rows,layer).length}${layer==='research'?'项去重研究记录':'条计划议题'} · ${words.length}个${meetingView()==='topics'?'议题':'Biomarker'}词条</p></a>`}).join('')}</div>`;
}
function meetingCrossLayerThemes(baseline){
 const r=meetingWords(baseline.research,'research','topics'),a=meetingWords(baseline.agenda,'agenda','topics'),shared=r.filter(w=>a.some(v=>v.id===w.id));
 if(!shared.length)return '';
 return `<details class="meeting-comparison-details"><summary>查看ADA研究记录与CDS计划议题的主题交集（${shared.length}项）</summary><p class="meta">这里表示研究问题上的关联；CDS计划议题尚不能提供独立研究结果。</p><div class="meeting-word-chips">${shared.map(w=>`<a href="${meetingUrl({conference:allLabel,region:allLabel,material:allLabel,cloud:'topics',biomarker:allLabel,meeting_topic:w.id})}" data-conference-word="${w.id}">${esc(w.label)}</a>`).join('')}</div></details>`;
}
function meetingComparison(current,baseline){
 const selected=sourceItem(pget('conference')),viewName=meetingView()==='topics'?'议题':'Biomarker',activeLayers=[meetingMaterial()];
 return `<section class="panel meeting-comparison" aria-labelledby="meeting-comparison-title"><h2 id="meeting-comparison-title">${selected?esc(selected.name)+' · 关注对照':'已收录会议 · 关注分布'}</h2><p class="meta">同年份、用途、搜索及词条范围对照；下方总览不受当前具体会议与国内外筛选限制。</p>${meetingCoverageCards(baseline)}
 <div class="meeting-compare-notice"><b>跨会议特色：同层资料待补</b><p>当前研究记录仅来自ADA，计划议题仅来自CDS。“共同关注、本会议更集中、独有线索”待取得其他会议同层资料后再判断；本版先展示覆盖与问题交集。</p></div>
 ${selected?`<div class="meeting-layer-counts">${activeLayers.map(layer=>{const curWords=meetingWords(current[layer],layer),baseWords=meetingWords(baseline[layer],layer),missing=baseWords.filter(w=>!curWords.some(x=>x.id===w.id));return `<div class="meeting-layer-count" data-compare-layer="${layer}"><b>${meetingLayerNames[layer]}</b><span>当前会议${curWords.length}个${viewName}词条 / 全部已收录会议${baseWords.length}个</span>${missing.length?`<details><summary>当前未覆盖的${missing.length}个词条</summary><p>${missing.map(w=>`<a href="${meetingUrl({conference:allLabel,region:allLabel,material:layer,biomarker:w.type==='biomarker'?w.id:allLabel,meeting_topic:w.type==='topic'?w.id:allLabel})}" data-conference-word="${w.id}">${esc(w.label)}</a>`).join('、')}</p></details>`:''}</div>`}).join('')}</div>`:''}${meetingCrossLayerThemes(baseline)}<p class="meta">对照仅反映已收录资料。独有或未覆盖线索不等于领域有无，也不表示随时间升温或下降。</p></section>`;
}
function meetingSelectionBanner(){const selected=meetingSelectedWord();if(!selected)return '';const isMarker=meetingView()==='biomarkers',name=isMarker?selected.label:selected.name;return `<section class="meeting-selection" aria-live="polite"><div><b>正在查看：${esc(name)}</b><p>下方研究与议题已按词条筛选。</p></div><div class="meeting-selection-actions"><a class="button secondary" href="${meetingUrl({biomarker:allLabel,meeting_topic:allLabel})}">清除词条筛选</a>${isMarker?`<a href="${markerUrl(selected,pget('category'),{tab:'papers'})}">论文进展 →</a><a href="${markerUrl(selected,pget('category'),{tab:'matching'})}">吉因加技术匹配 →</a>`:`<a href="${url('topic/'+selected.id,{tab:'papers'})}">相关论文 →</a><a href="${url('topic/'+selected.id,{tab:'matching'})}">技术匹配 →</a>`}</div></section>`}
function conferencesPage(){
 const conf=pget('conference'),region=pget('region'),selected=sourceItem(conf),current=meetingRecordPool(),baseline=meetingRecordPool({baseline:true}),material=meetingMaterial(),view=meetingView(),eligibleSources=conferenceSources.filter(s=>region===allLabel||regionOf(s)===region),years=[...new Set([...D.ada,...D.topics].map(meetingYear))].filter(y=>y!=='pending').sort().reverse();
 const studies=material==='agenda'?[]:meetingSelectRows(current.research,'research'),agendas=material==='research'?[]:meetingSelectRows(current.agenda,'agenda');
 return heading('会议研究','从全部已收录会议的关注分布出发，选择会议与词条，查看团队、研究及技术用途。')+`<div class="line-context"><span>会议主线 · 词云与研究联动</span><a href="${url('sources',{group:'conference'})}">查看会议来源 →</a></div><div class="filters meeting-filters">${selectFilter('year','年份',years.map(y=>[y,y]))}${selectFilter('region','会议来源',[['domestic','国内会议'],['international','国际会议']])}${selectFilter('conference','会议',eligibleSources.map(s=>[s.id,s.name]))}${topicSelect()}</div>
 <div class="meeting-view-controls"><nav class="meeting-toggle" aria-label="词云视图">${[['biomarkers','Biomarker'],['topics','研究议题']].map(([id,name])=>`<a href="${meetingUrl({cloud:id,biomarker:allLabel,meeting_topic:allLabel})}" class="${view===id?'active':''}" ${view===id?'aria-current="true"':''}>${name}</a>`).join('')}</nav><nav class="meeting-toggle" aria-label="材料层次">${[['research','研究记录'],['agenda','计划议题']].map(([id,name])=>`<a href="${meetingUrl({material:id,biomarker:allLabel,meeting_topic:allLabel})}" class="${material===id?'active':''}" ${material===id?'aria-current="true"':''}>${name}</a>`).join('')}</nav>${view==='biomarkers'?scopeControl():''}${translationControl()}</div>${translationContext()}
 ${selected?`<details class="meeting-source-details"><summary>${esc(selected.name)} · 查看已有覆盖与来源</summary><p>${esc(selected.note)}</p>${sourceLink(selected)}</details>`:''}
 <div class="meeting-cloud-stack">${meetingCloud(material,current[material])}</div>

const PAPER_EVIDENCE=JSON.parse(document.getElementById('paper-evidence-data').textContent);
function paperView(){return pget('cloud')==='biomarkers'?'biomarkers':'topics'}
function paperParams(changes={}){const p={...Object.fromEntries(route.params),...changes};for(const k of Object.keys(p))if(!p[k]||(p[k]===allLabel&&k!=='scope'))delete p[k];return p}
function paperUrl(changes={}){return url('papers',paperParams(changes))}
function paperUnique(rows){const ids=new Set(),dois=new Set();return rows.filter(r=>{const id=canonicalId(r),doi=(article(r).doi||'').trim().toLowerCase();if(ids.has(id)||doi&&dois.has(doi))return false;ids.add(id);if(doi)dois.add(doi);return true})}
function paperTimeMatch(r){const date=paperDate(r);if(!date)return pget('dates')!=='exclude';const period=pget('period');if(period==='last12'){const end=new Date(D.cutoff+'T00:00:00Z'),start=new Date(end);start.setUTCFullYear(start.getUTCFullYear()-1);return date>=start.toISOString().slice(0,10)&&date<=D.cutoff}if(/^20\d{2}$/.test(period))return date.slice(0,4)===period;return true}
function paperBasePool(){const journal=pget('journal'),category=pget('category'),tech=pget('tech'),legacyTopic=pget('topic');return paperUnique(paperRecords.filter(r=>paperTimeMatch(r)&&(journal===allLabel||article(r).journal===journal)&&(!bioCategory(category)||meetingRecordCategory(r,category))&&(tech===allLabel||techIds(r).includes(tech))&&(legacyTopic===allLabel||r.thread_ids.includes(legacyTopic))&&meetingItemMatches(r,'research')&&translationRecordMatch(r,'research'))).sort((a,b)=>(paperDate(b)||'').localeCompare(paperDate(a)||''))}
function paperWords(rows){return meetingWords(rows,'research',paperView())}
function paperSelectedWord(){return paperView()==='biomarkers'?biomarker(pget('biomarker')):thread(pget('paper_topic'))}
function paperWordHref(word){return paperUrl({cloud:paperView(),biomarker:word.type==='biomarker'?word.id:allLabel,paper_topic:word.type==='topic'?word.id:allLabel})}
function paperSelectedRows(rows){const selected=paperSelectedWord();if(!selected)return rows;const word=paperWords(rows).find(w=>w.id===selected.id);return word?rows.filter(r=>word.items.some(x=>canonicalId(x)===canonicalId(r))):[]}
function paperMeetingVersions(r){const ids=new Set(r.ada_source_ids||[]);return D.ada.filter(a=>ids.has(a.id)||canonicalId(a)===canonicalId(r))}
function paperEvidenceBlock(r){const evidence=PAPER_EVIDENCE.entries[r.id],meetings=paperMeetingVersions(r);return `<section class="paper-evidence-stage" aria-label="研究类型与验证阶段"><div class="meta-row"><span>研究类型与验证</span>${(evidence?.labels||['阶段待核']).map(t=>pill(t,/待核|待补|未复现/.test(t)?'pending':'')).join('')}</div><details><summary>查看阶段依据与适用范围</summary><p>${esc(evidence?.basis||'已有资料未明确验证设计，待补核。')}</p>${evidence?.caveat?`<p>${esc(evidence.caveat)}</p>`:''}<p class="meta">基于已存设计和局限的编辑标注；读取层次见卡片，验证信息仍按具体研究解释。</p></details>${meetings.length?`<div class="paper-meeting-versions"><span>已关联会议：</span>${meetings.map(m=>`<a href="${studyUrl(m,'conference')}">${esc(m.conference)} · ${esc(m.code)} →</a>`).join('')}<span>同研究版本</span></div>`:''}</section>`}
function paperCloud(rows){const words=paperWords(rows),selected=paperSelectedWord(),max=Math.max(1,...words.map(w=>w.items.length)),covered=new Set(words.flatMap(w=>w.items.map(canonicalId))),journal=pget('journal'),view=paperView(),name=view==='topics'?'研究议题':'Biomarker';return `<section class="cloud-section paper-cloud-section" aria-label="论文${name}词云"><div class="meeting-cloud-heading"><div><div class="meta-row">${pill('正式论文')}<span>${words.length}个词条 · ${rows.length}篇去重研究</span></div><h2>${journal===allLabel?'全部已收录论文':esc(journal)} · ${name}词云</h2></div><a href="#/sources?section=biomarker">判读标准 →</a></div><p class="meta">字号按当前范围的去重研究数显示；点击词条筛选下方论文。词云反映已有资料分布，热点认定另行复核。</p>${words.length?`<div class="biomarker-cloud paper-cloud" role="group" aria-label="点击词条筛选论文">${words.map(w=>{const n=w.items.length,font=n===1?18:18+Math.round(12*Math.log2(n)/Math.log2(Math.max(2,max))),journals=[...new Set(w.items.map(r=>article(r).journal))].join('、'),fitName=w.fit==='direct'?'文献技术关联':w.fit==='related'?'方法参考':w.fit==='topic'?'研究议题':'承接待确认';return `<a class="cloud-word conference-word fit-${w.fit} ${selected?.id===w.id?'selected-word':''}" style="font-size:${font}px" href="${paperWordHref(w)}" data-paper-word="${w.id}" data-count="${n}" title="${esc(w.label)} · ${n}篇去重研究 · ${esc(w.kind)} · 期刊：${esc(journals)} · ${esc(translationWordNote(w,'research'))}" aria-label="${esc(w.label)}，${n}篇去重研究，${esc(w.kind)}，${fitName}" ${selected?.id===w.id?'aria-current="true"':''}>${esc(w.label)}</a>`}).join('')}</div>`:empty(view==='biomarkers'?'当前论文范围尚无已整理的Biomarker词条，可切换研究议题或调整筛选。':'当前范围尚无已归类议题，请调整期刊、时间或其他筛选。')}<p class="meta meeting-cloud-coverage">${covered.size}/${rows.length}篇研究已关联本视图词条${rows.length>covered.size?`；另有${rows.length-covered.size}篇未关联，仍保留在论文列表`:''}。同研究版本合并，研究数不等于独立验证数。</p>${words.length?`<details class="meeting-word-list"><summary>按列表查看词条与计数</summary><div class="meeting-word-chips">${words.map(w=>`<a href="${paperWordHref(w)}" data-paper-word="${w.id}">${esc(w.label)} <span>${w.items.length}</span></a>`).join('')}</div></details>`:''}</section>`}
function paperSelectionBanner(){const selected=paperSelectedWord();if(!selected)return '';const isMarker=paperView()==='biomarkers';return `<section class="meeting-selection paper-selection" aria-live="polite"><div><b>正在查看：${esc(isMarker?selected.label:selected.name)}</b><p>下方论文已按词条筛选；上方保留当前范围词云。</p></div><div class="meeting-selection-actions"><a class="button secondary" href="${paperUrl({biomarker:allLabel,paper_topic:allLabel})}">清除词条筛选</a>${isMarker?`<a href="${markerUrl(selected,pget('category'),{tab:'meetings'})}">会议动向 →</a><a href="${markerUrl(selected,pget('category'),{tab:'matching'})}">吉因加技术匹配 →</a>`:`<a href="${url('topic/'+selected.id,{tab:'meetings'})}">相关会议 →</a><a href="${url('topic/'+selected.id,{tab:'matching'})}">技术匹配 →</a>`}</div></section>`}

function papersPage(){const base=paperBasePool(),rows=paperSelectedRows(base),shown=rows.slice(0,limit),known=shown.filter(paperDate),pending=shown.filter(r=>!paperDate(r)),pendingTotal=rows.filter(r=>!paperDate(r)).length,view=paperView(),journals=[...new Set(paperRecords.map(r=>article(r).journal))].sort(),years=[...new Set(paperRecords.map(paperDate).filter(Boolean).map(d=>d.slice(0,4)))].sort().reverse();return heading('论文研究','从论文议题与Biomarker出发，查看团队、方法、研究发现及验证阶段。')+`<div class="line-context"><span>论文主线 · 词云与证据联动</span><a href="${url('sources',{group:'journal'})}">查看期刊来源 →</a></div><div class="filters paper-filters">${selectFilter('period','发表时间',[['last12','近12个月（截至'+D.cutoff+'）'],...years.map(y=>[y,y+'年'])])}${selectFilter('journal','期刊',journals.map(j=>[j,j]))}${topicSelect()}${techSelect()}<label>日期待核<select data-filter="dates">${option('include','包含并单列',pget('dates')==='exclude'?'exclude':'include')}${option('exclude','排除日期待核',pget('dates')==='exclude'?'exclude':'include')}</select></label></div><div class="meeting-view-controls"><nav class="meeting-toggle" aria-label="论文词云视图">${[['topics','研究议题'],['biomarkers','Biomarker']].map(([id,name])=>`<a href="${paperUrl({cloud:id,biomarker:allLabel,paper_topic:allLabel})}" class="${view===id?'active':''}" ${view===id?'aria-current="true"':''}>${name}</a>`).join('')}</nav>${view==='biomarkers'?scopeControl():''}${translationControl()}</div>${translationContext()}${paperCloud(base)}${view==='biomarkers'?`<div class="meeting-fit-legend" aria-label="论文词云技术关联图例"><span class="fit-direct">● 文献技术关联</span><span class="fit-related">● 方法参考</span><span class="fit-pending">● 承接待确认</span></div>`:''}<section class="paper-records" id="paper-records" tabindex="-1">${paperSelectionBanner()}${translationReviewPanel(rows,'research',paperSelectedWord())}<div class="result-line" aria-live="polite"><b>${rows.length}篇去重研究 · ${pendingTotal}篇在线日期待核</b><a href="#/criteria">文章相关性标准 →</a></div><p class="scope-note">已核日期按论文在线日排序；日期待核记录单列，不视为已确认符 /* Use-specific, source-bound translation appraisal; no collection or numeric scoring. */
const TRANSLATION=JSON.parse(document.getElementById('translation-review-data').textContent);
const translationLabels={priority:'优先转化线索',pending:'证据待补',reference:'常规参照'};
function translationState(){return ['priority','pending'].includes(pget('translation'))?pget('translation'):'all'}
function translationControl(){return `<label class="translation-control">转化价值<select data-filter="translation">${option('all','全部',translationState())}${option('priority','优先转化线索',translationState())}${option('pending','证据待补',translationState())}</select></label>`}
function translationContext(){return `<p class="translation-context">转化价值按已有Biomarker用途初判；“优先”表示优先评估临床验证。吉因加适配单列，研究议题按关联Biomarker联动。<a href="#/sources?section=biomarker">查看判断口径 →</a></p>`}
function translationSourceKey(id){const r=byId(id);return r?canonicalId(r):id}
function translationCaseVisible(c){return (pget('category')===allLabel||c.categories.includes(pget('category')))&&(c.role!=='reference'||bioScope()==='all')}
function translationCaseInRows(c,rows,layer){if(!translationCaseVisible(c))return false;const ids=new Set(rows.map(r=>layer==='agenda'?r.code:canonicalId(r)));return (layer==='agenda'?c.agenda_codes:c.record_ids.map(translationSourceKey)).some(id=>ids.has(id))}
function translationCases(id,rows,layer,applyFilter=true){const cases=TRANSLATION.entries[id]?.cases||[],state=translationState();return cases.filter(c=>translationCaseInRows(c,rows,layer)&&(!applyFilter||state==='all'||c.status===state))}
function translationRecordMatch(r,layer){const state=translationState();return state==='all'||Object.keys(TRANSLATION.entries).some(id=>translationCases(id,[r],layer).length)}
function translationFilterRows(rows,layer){return rows.filter(r=>translationRecordMatch(r,layer))}
function translationWordMatch(w,layer){return w.type!=='biomarker'||translationState()==='all'||translationCases(w.id,w.items,layer).length>0}
function translationWordNote(w,layer){if(w.type!=='biomarker')return '议题按关联Biomarker用途初判联动';const cases=translationCases(w.id,w.items,layer),states=[...new Set(cases.map(c=>translationLabels[c.status]))];return states.length?'转化初判：'+states.join('、'):'当前未匹配到适用用途初判'}
function translationEvidenceLink(item,layer){const r=byId(item.id);if(r){const view=r.entity_kind==='paper'?'paper':route.path[0]==='papers'&&r.paper?'paper':'conference';return `<a href="${studyUrl(r,view)}">${esc(item.id)} · ${view==='paper'?'论文':'会议记录'} →</a>`}const a=D.topics.find(t=>t.code===item.id);return a?externalLinks([{label:'CDS议程 '+a.code,url:a.source_url}]):esc(item.id)}
function translationReviewPanel(rows,layer,selected=null){const groups=Object.entries(TRANSLATION.entries).filter(([id])=>!selected||!biomarker(selected.id)||selected.id===id).map(([id,e])=>({id,label:e.label,cases:translationCases(id,rows,layer)})).filter(g=>g.cases.length),count=status=>groups.filter(g=>g.cases.some(c=>c.status===status)).length,open=!!selected||translationState()==='priority';return `<details class="translation-review" ${open?'open':''}><summary>转化价值初判 <span>${groups.length}个词条 · 优先${count('priority')} · 证据待补${count('pending')}${count('reference')?' · 参照'+count('reference'):''}</span></summary><p class="meta">基于已收录资料的编辑初判（${TRANSLATION.reviewed_on}）。当前只显示本范围关联用途；同一研究可关联不同优先级词条，同一词条不同用途也可分别判断，各状态计数不直接相加。优先理由、临床增量及公司可参与环节分别核对。</p>${groups.length?`<div class="translation-review-list">${groups.map(g=>`<article class="translation-term" data-translation-term="${g.id}"><h3>${esc(g.label)}</h3>${g.cases.map(c=>`<section class="translation-case" data-translation-case="${c.id}" data-translation-status="${c.status}"><div class="meta-row">${pill(translationLabels[c.status],c.status==='pending'?'pending':'')}<span>${esc(c.question)}</span></div><p><b>${c.status==='priority'?'优先理由':'当前判断依据'}：</b>${esc(c.reason)}</p><p><b>验证与检测路径：</b>${esc(c.validation)} ${esc(c.assay_route)}</p><div class="translation-gaps"><b>待补证据</b><ul>${c.gaps.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><p><b>吉因加可参与的环节：</b>${esc(c.participation.action)}</p><p class="meta">适配状态：${esc(c.participation.fit_status)}</p><details><summary>查看已有依据与公司能力范围</summary><ul class="translation-evidence">${c.evidence.map(item=>`<li>${translationEvidenceLink(item,layer)}<p>${esc(item.basis)}</p><p class="meta">${esc(item.limits)}</p></li>`).join('')}</ul><p class="meta">能力底表：${esc(c.participation.capability_ids.join('、'))}；沿用${TRANSLATION.company_capability_as_of}版确认范围。具体项目按样本、平台、分析及验证交付逐项确认。</p>${c.participation.tech_id?`<a class="text-action" href="${url('technologies',{tech:c.participation.tech_id})}">查看相关技术范围 →</a>`:''}<p class="meta">同研究会议/论文版本关联保存，不视为新增独立验证。AI初判，${esc(TRANSLATION.human_review)}。</p></details></section>`).join('')}</article>`).join('')}</div>`:empty(translationState()==='priority'?'当前材料层尚无符合优先条件的Biomarker线索；可切换“证据待补”或“全部”查看现有材料。':'当前范围尚无适用的Biomarker用途初判；可调整筛选或词条范围。')}</details>`}
function translationMethodSection(){const priorities=Object.values(TRANSLATION.entries).filter(e=>e.cases.some(c=>c.status==='priority'));return `<details class="coverage-note biomarker-method-details translation-method"><summary>转化价值筛选：本轮判断与使用方法</summary><p>已用现有资料整理${Object.keys(TRANSLATION.entries).length}个词条、${Object.values(TRANSLATION.entries).reduce((n,e)=>n+e.cases.length,0)}个具体用途。优先评估线索为${priorities.map(e=>esc(e.label)).join('、')}；逐项理由、待补证据和吉因加可参与环节在会议/论文页的“转化价值初判”中查看。</p><ul>${Object.entries(TRANSLATION.rules).map(([id,text])=>`<li><b>${translationLabels[id]}：</b>${esc(text)}</li>`).join('')}</ul><p>临床用途、验证基础和检测路径共同支持初判；吉因加适配单列，不凭技术相关或论文数量升级。阴性、结果待核、机制和计划议题保留各自依据。不同用途分别判断，各状态计数可能交叉，不直接相加。</p><p>两条主线只按本层实际关联的Biomarker筛选；研究议题按筛选后关联记录联动，不把药物试验阶段当作Biomarker成熟度。当前优先两项仅关联论文材料，会议优先筛选为空时保留真实空态。</p><p>初判日期${TRANSLATION.reviewed_on}，科研资料截止${TRANSLATION.research_cutoff}；公司能力范围沿用${TRANSLATION.company_capability_as_of}版底表，具体交付待项目适配确认。${esc(TRANSLATION.reviewer)}，${esc(TRANSLATION.human_review)}，本次无新增采集。</p><div class="links"><a href="#/papers?cloud=biomarkers&translation=priority">查看优先转化论文线索 →</a><a href="#/conferences?translation=pending">查看会议待补证据线索 →</a></div></details>`}

function fieldOverviewPage(){const f=activeField(),questions=f.questions.filter(q=>(pget('use')===allLabel||q.id===pget('use'))&&matches(q));return heading(f.name,'先明确临床问题，再连接会议、论文和吉因加可参与的研究环节。')+weeklyHomeModule()+fieldNameBanner()+`<section class="panel field-scope-card"><h2>当前工作范围</h2><p>${esc(f.scope)}</p><div class="tags field-disease-tags">${f.diseases.map(d=>`<span class="pill">${esc(d)}</span>`).join('')}</div><details><summary>范围边界与交叉主题</summary><p>${esc(f.boundary)}</p><p>${esc(FIELD_CONFIG.naming_status)}。以下临床问题为基于已有目录的整理草案，具体人群与用途仍需回原件校准。</p></details></section><section class="section-heading"><div><h2>围绕哪些临床问题整理</h2><p>问题草案来自已有知识线索，尚未据此认定热点或成熟标志物。</p></div></section><div class="field-question-grid">${questions.map(q=>`<article class="panel field-question"><div class="meta-row">${pill('研究问题草案')}</div><h2>${esc(q.name)}</h2><p>${esc(q.question)}</p><p class="meta">已有基础：${esc(q.basis)}</p><div class="links"><a href="${url('conferences',{use:q.id})}">会议路径 →</a><a href="${url('papers',{use:q.id})}">论文路径 →</a></div></article>`).join('')||empty('当前关键词没有匹配的问题草案，请调整搜索。')}</div><section class="section-heading"><h2>从哪里继续</h2></section><div class="field-module-grid">${[['conferences','会议研究','已存会议线索与来源位置；议题、团队和原始链接待逐项整理。'],['papers','论文研究','从既有文献目录开始；验证阶段与转化价值待按原文判断。'],['technologies','产品与技术','按问题查看公司参与环节、能力依据和具体适配缺口。'],['sources','信息来源','查看本领域已存在的方案、能力表、转写及交叉材料。']].map(([path,name,desc])=>`<a href="${url(path)}" class="panel field-module"><h2>${name}</h2><p>${desc}</p><b>进入${name} →</b></a>`).join('')}</div><section class="panel field-materials"><h2>已有基础与待补内容</h2><p>已有：${esc(f.basis)} 临床问题与公司参与环节可先讨论。</p><p>待整理：会议/期刊完整清单、逐项研究元数据、Biomarker成员与样本、独立验证、转化理由及公司现行交付。</p>${fieldReferences(f.references)}</section>`}
function fieldSourceCards(sources){return `<div class="source-grid field-source-grid">${sources.map(s=>`<article class="panel field-source-card" data-field-source="${s.id}"><div class="meta-row">${pill(s.kind==='conference'?(regionName[s.region]||'会议线索'):'期刊/文献入口')}${pill(s.status,'pending')}</div><h2>${esc(s.name)}</h2><p>${esc(s.note)}</p><div class="links">${externalLinks(s.links)}</div>${fieldReferences(s.references)}</article>`).join('')||empty('当前筛选没有来源线索，调整地区、来源或关键词后查看。')}</div>`}
function fieldConferencePage(){const f=activeField(),region=pget('region'),selected=pget('conference'),sources=f.conference_sources.filter(s=>(region===allLabel||s.region===region)&&(selected===allLabel||s.id===selected)&&matches(s));return heading(f.name+' · 会议研究','先复用已有会议方向及知识入口，逐项研究资料整理后再形成词云与转化判断。')+fieldNameBanner()+`<div class="filters field-framework-filters">${selectFilter('region','会议来源',[['domestic','国内会议'],['international','国际会议']])}${selectFilter('conference','会议/来源位置',f.conference_sources.filter(s=>region===allLabel||s.region===region).map(s=>[s.id,s.name]))}${fieldQuestionFilter()}</div>${fieldUseContext()}<div class="meeting-view-controls">${fieldModeLinks()}</div>${fieldCloudPlaceholder('会议')}<section class="section-heading"><div><h2>已有会议线索与来源位置</h2><p>名称线索、历史特定材料和待定位入口分别标注；本次未核新届次或采集议程。</p></div></section>${fieldSourceCards(sources)}<section class="panel field-materials"><h2>后续逐项研究应保留什么</h2><p>会议与届次、原始议题、报告/计划状态、团队及单位、具体临床问题、测量对象与样本、来源链接、与论文的版本关系。</p><div class="links"><a href="${url('sources')}">本领域资料依据 →</a><a href="${url('criteria',{section:'hotspots'})}">共用热点判断口径 →</a></div></section>`}
function fieldPaperPage(){const f=activeField(),selected=pget('source'),sources=f.paper_sources.filter(s=>(selected===allLabel||s.id===selected)&&matches(s));return heading(f.name+' · 论文研究','从已有文献目录核对具体问题、检测流程与验证证据，再判断临床转化机会。')+fieldNameBanner()+`<div class="filters field-framework-filters">${selectFilter('source','文献来源位置',f.paper_sources.map(s=>[s.id,s.name]))}${fieldQuestionFilter()}</div>${fieldUseContext()}<div class="meeting-view-controls">${fieldModeLinks()}</div>${fieldCloudPlaceholder('论文')}<section class="section-heading"><div><h2>已有文献材料入口</h2><p>目录或笔记入口尚未导入为本领域正式论文台账，也不据此生成转化评级。</p></div></section>${fieldSourceCards(sources)}<section class="panel field-materials"><h2>转化价值判断预留</h2><p>逐篇补齐临床用途、样本和平台、现有方法参照、发现/内部/独立验证、检测落地路径，再说明优先理由、待补证据及吉因加参与环节。当前本领域尚无逐项初判。</p><div class="links"><a href="${url('sources',{section:'biomarker'})}">共用转化与词云规则 →</a><a href="${url('technologies')}">本领域候选技术 →</a></div></section>`}

function fieldSourcesPage(){if(pget('section')==='biomarker')return fieldMethodsPage();const f=activeField(),group=pget('group'),all=[...f.conference_sources,...f.paper_sources],sources=all.filter(s=>(group===allLabel||s.kind===group)&&matches(s)),docs=f.references.filter(id=>matches(FIELD_CONFIG.knowledge[id]));return heading(f.name+' · 信息来源','复用已有知识库材料；区分材料已存在、来源仅有名称、逐项研究尚未接入。')+`<div class="filters field-framework-filters">${selectFilter('group','资料类型',[['conference','会议线索'],['journal','文献来源位置'],['knowledge','本地知识材料']])}</div><section class="panel field-scope-card"><h2>名称与范围怎样确定</h2><p>${esc(f.basis)} ${esc(FIELD_CONFIG.naming_status)}。</p><div class="links"><a href="${url('field-scope')}">查看六领域范围与核对依据 →</a><a href="${url('sources',{section:'biomarker'})}">共用判断口径 →</a></div></section>${group!=='knowledge'?fieldSourceCards(sources):''}${group===allLabel||group==='knowledge'?`<section class="section-heading"><h2>已核读的本地材料入口</h2></section><div class="source-grid">${docs.map(id=>{const k=fieldKnowledge(id);return `<article class="panel field-source-card"><div class="meta-row">${pill('本地材料摘录')}</div><h2><a href="${url('knowledge/'+id)}">${esc(k.title)} →</a></h2><p>${esc(k.status)}</p><p class="meta">${esc(k.location)}</p></article>`}).join('')||empty('当前关键词未匹配到材料。')}</div>`:''}`}
function fieldKnowledgePage(id){const cid=id?.startsWith('capability-')?id.slice(11):null,c=FIELD_CONFIG.capabilities[cid];if(c){return heading(c.name,'公司能力底表 · 2026-11-10确认范围',`<a class="button secondary" href="${url('technologies')}">返回本领域技术</a>`)+`<article class="panel field-materials"><p><b>确认状态：</b>${esc(c.status)}</p><p><b>已有依据：</b>${esc(c.basis)}</p><p><b>适配缺口：</b>${esc(c.scope)}</p>${fieldReferences(['K02'])}</article>`}const k=fieldKnowledge(id);if(!k)return heading('本领域资料待整理','可以返回本领域信息来源查看已有材料。')+`<a href="${url('sources')}">返回资料入口 →</a>`;return heading(k.title,'已有本地知识材料摘录',`<a class="button secondary" href="${url('sources',{group:'knowledge'})}">返回本领域资料</a>`)+`<article class="panel field-knowledge"><div class="meta-row">${pill(k.status)}</div><p class="meta">材料：${esc(k.document)}<br>位置：${esc(k.location)}</p><section class="detail-section"><h2>本次复用的内容</h2>${k.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}<ul>${k.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><p class="meta">以上为已存笔记的摘录或归纳。核对日期${FIELD_CONFIG.checked_on}；本次未访问外站或重新核读全部原件，内容不代表新增研究结果。</p></article>`}
function fieldScopePage(){return heading('六个工作领域 · 名称与范围','按已有知识包工作分组建立导航，正式业务边界继续保留核对状态。')+`<section class="panel field-scope-card"><h2>本次核对结论</h2><p>${esc(FIELD_CONFIG.naming_status)}。${esc(FIELD_CONFIG.scope_note)}</p>${fieldReferences(FIELD_CONFIG.naming_basis)}<details><summary>查看本轮核对发现的命名差异</summary><ul>${FIELD_CONFIG.naming_discrepancies.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details></section><div class="field-question-grid">${FIELD_CONFIG.fields.map(f=>`<article class="panel"><h2>${esc(f.name)}</h2><p>${esc(f.scope)}</p><div class="links"><a href="${url('overview',{field:f.id})}">进入${esc(f.name)} →</a></div></article>`).join('')}</div><p class="scope-note">交叉病种按问题多重关联，后续按同研究记录去重；不把旧资料目录归属当作医学分类或新的正式业务组织。</p>`}
function fieldPage(page,id){let content;if(page==='overview')content=fieldOverviewPage();else if(page==='conferences')content=fieldConferencePage();else if(page==='papers')content=fieldPaperPage();else if(page==='technologies')content=fieldTechnologyPage();else if(page==='sources')content=fieldSourcesPage();else if(page==='criteria')content=criteriaPage().replaceAll('涉及哪类糖尿病、人群、疾病阶段或并发症？邻域研究怎样连接糖尿病问题？','涉及本领域哪些疾病、人群、阶段或并发症？邻域研究怎样连接具体临床问题？').replaceAll('糖尿病','本领域')+`<p class="scope-note">以上为跨领域共用的判断方法，源于既有试点执行标准；当前领域尚未进行逐项评分或转化认定。</p>`;else content=heading('本领域尚未接入该研究记录','请从当前领域资料框架继续；糖尿病试点的研究详情在其自身领域查看。')+`<a class="button secondary" href="${url('overview')}">返回本领域总览</a>`;return `<div class="field-shell" data-active-field="${activeFieldId()}">${content}</div>`}
function fieldSidebar(){const f=activeField(),s=section();let links=`<a href="${url('overview')}">${esc(f.name)}总览</a>`;if(['overview','papers','conferences'].includes(s)){links+='<p class="directory-label">临床问题草案</p>'+f.questions.map(q=>`<a href="${url(s,{use:q.id})}" class="${pget('use')===q.id?'active':''}">${esc(q.name)}</a>`).join('')}if(s==='technologies')links+='<p class="directory-label">候选能力</p>'+f.capability_ids.map(id=>`<a href="${url('technologies',{tech:id})}">${esc(FIELD_CONFIG.capabilities[id]?.name||id)}</a>`).join('');if(s==='sources')links+=`<a href="${url('sources')}">全部资料入口</a><a href="${url('sources',{group:'conference'})}">会议线索</a><a href="${url('sources',{group:'journal'})}">文献来源位置</a><a href="${url('sources',{group:'knowledge'})}">本地知识材料</a><a href="${url('field-scope')}">六领域范围依据</a>`;if(s==='criteria')links+=[['relevance','文章相关性'],['hotspots','热点判断'],['fit','公司适配']].map(([id,name])=>`<a href="${url('criteria',{section:id})}" class="${pget('section')===id?'active':''}">${name}</a>`).join('');return `<details class="directory" ${window.matchMedia('(min-width:901px)').matches?'open':''}><summary>领域目录</summary><nav aria-label="本领域目录">${links}</nav></details>`}
function syncFieldChrome(){const f=activeField();document.getElementById('field').value=f.id;document.querySelectorAll('[data-nav]').forEach(a=>a.href=url(a.dataset.nav));document.querySelector('.brand').href=url('overview');document.getElementById('footer-label').textContent=isDiabetesField()?'研究资料截至':'本地知识核对';document.getElementById('cutoff').textContent=isDiabetesField()?D.cutoff:FIELD_CONFIG.checked_on;document.getElementById('footer-kind').textContent=isDiabetesField()?'B03快照':'框架版';document.getElementById('footer-note').textContent=isDiabetesField()?'会议与论文关联保存 · 主题趋势待建立可比基线':'已有材料入口 · 逐项研究与转化判断待接入'}
document.getElementById('field').innerHTML=FIELD_CONFIG.fields.map(f=>`<option value="${f.id}">${esc(f.selector_label)}</option>`).join('');
document.getElementById('field').addEventListener('change',e=>{clearTimeout(searchTimer);fieldNavigationMemory.set(activeFieldId(),location.hash);const id=e.target.value,saved=fieldNavigationMemory.get(id);if(saved){location.hash=saved;return}const page=['overview','conferences','papers','technologies','sources','criteria','weekly-meetings'].includes(route.path[0])?route.path[0]:'overview';location.hash=url(page,{field:id,...(route.params.has('week')?{week:route.params.get('week'),weekly_tab:route.params.get('weekly_tab')}:{ }),...(page==='criteria'&&['relevance','hotspots','fit'].includes(pget('section'))?{section:pget('section')}:{})})});

// Meeting calendar and change events are separate from research publication/ingestion dates.
const WEEKLY=JSON.parse(document.getElementById('weekly-meetings-data').textContent);
function weeklyDate(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value||''))return null;const date=new Date(value+'T00:00:00Z');return Number.isFinite(+date)&&date.toISOString().slice(0,10)===value?date:null}
function weeklyISO(date){return date.toISOString().slice(0,10)}
function weeklyShift(day,days){const date=weeklyDate(day);date.setUTCDate(date.getUTCDate()+days);return weeklyISO(date)}
function weeklyToday(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const val=k=>parts.find(p=>p.type===k).value;return `${val('year')}-${val('month')}-${val('day')}`}
function weeklyMonday(day){const d=weeklyDate(day);return weeklyShift(day,-((d.getUTCDay()+6)%7))}
function weeklyStart(){const day=route.params.get('week');return weeklyMonday(weeklyDate(day)?day:weeklyToday())}
function weeklyTab(){return pget('weekly_tab')==='updates'?'updates':'occurring'}
function weeklyParams(extra={}){return {week:weeklyStart(),weekly_tab:weeklyTab(),...extra}}
function weeklyHref(path='overview',extra={}){return url(path,weeklyParams(extra))}
function weeklyMeetings(){return WEEKLY.meetings.filter(m=>m.fields.includes(activeFieldId()))}
function weeklyRows(tab=weeklyTab()){const start=weeklyStart(),end=weeklyShift(start,6),meetings=weeklyMeetings();if(tab==='updates')return WEEKLY.update_events.filter(e=>meetings.some(m=>m.id===e.meeting_id)&&e.recorded_on>=start&&e.recorded_on<=end).sort((a,b)=>b.recorded_on.localeCompare(a.recorded_on));return meetings.filter(m=>weeklyDate(m.start)&&weeklyDate(m.end)&&m.start<=end&&m.end>=start).sort((a,b)=>a.start.localeCompare(b.start)||a.id.localeCompare(b.id))}
function weeklyMeetingLink(m){return weeklyHref('meeting/'+m.id,{return_to:route.path[0]==='weekly-meetings'?'list':'home'})}
function weeklyControls(page){const start=weeklyStart(),current=weeklyMonday(weeklyToday()),end=weeklyShift(start,6),occurring=weeklyRows('occurring').length,updates=weeklyRows('updates').length;return `<div class="weekly-controls"><nav class="weekly-tabs" aria-label="会议更新类型">${[['occurring','本周召开',occurring],['updates','本周新增／更新',WEEKLY.update_events.length?updates:'待核查']].map(([id,label,n])=>`<a class="${weeklyTab()===id?'active':''}" ${weeklyTab()===id?'aria-current="page"':''} href="${weeklyHref(page,{weekly_tab:id})}">${label}<span>${n}</span></a>`).join('')}</nav><nav class="weekly-weeks" aria-label="会议周切换"><a aria-label="上一周" href="${weeklyHref(page,{week:weeklyShift(start,-7)})}">← 上一周</a><a class="weekly-current ${start===current?'active':''}" href="${weeklyHref(page,{week:current})}">本周</a><a aria-label="下一周" href="${weeklyHref(page,{week:weeklyShift(start,7)})}">下一周 →</a></nav></div><p class="weekly-range"><time datetime="${start}">${start.replaceAll('-','.')}</time> — <time datetime="${end}">${end.replaceAll('-','.')}</time><span>周一至周日 · 北京时间${start===current?' · 当前周':''}</span></p>`}
function weeklyCard(m,event){return `<article class="weekly-card" data-meeting="${esc(m.id)}"><div class="meta-row">${pill(m.region==='domestic'?'国内':'国际')}${pill(m.priority)}${event?pill('资料更新'):''}</div><h3><a href="${weeklyMeetingLink(m)}">${esc(m.name)}</a></h3><p class="weekly-date">${esc(m.start)} — ${esc(m.end)} · ${esc(m.location)}</p>${event?`<p><b>${esc(event.kind)} · ${esc(event.recorded_on)}</b><br>${esc(event.summary)}</p>`:''}<p>${esc(m.priority_reason)}</p><p class="meta">资料：${esc(m.material)}</p><div class="links"><a href="${weeklyMeetingLink(m)}">会议详情 →</a></div></article>`}
function weeklyEmpty(){const noCalendar=!weeklyMeetings().length;return `<div class="weekly-empty"><b>${weeklyTab()==='updates'?'会议更新日志尚未建立':noCalendar?'本领域会议日期待整理':'当前已有资料中暂无这一周召开会议'}</b><p>${weeklyTab()==='updates'?'本周新增与变更尚未核查；已有资料的接入日期不算会议发布或更新日期。':noCalendar?'已有会议来源保留在来源目录；具体届次、日期及地点核对后再进入周列表。':'此列表仅覆盖已接入的会议日历，不能据此判断本周没有相关会议。'}</p><a href="${url('sources',{group:'conference'})}">查看已有会议来源 →</a></div>`}
function weeklyContent(all=false){const rows=weeklyRows(),shown=all?rows:rows.slice(0,4);return `<div class="weekly-card-grid">${shown.map(row=>weeklyTab()==='updates'?weeklyCard(WEEKLY.meetings.find(m=>m.id===row.meeting_id),row):weeklyCard(row)).join('')}</div>${shown.length?'':weeklyEmpty()}${!all&&rows.length>4?`<p class="meta">显示前4场，另有${rows.length-4}场可在完整列表查看。</p>`:''}`}
function weeklyStatus(){return `<p class="weekly-status">${pill('自动抓取未启动')} <span>沿用截至${esc(WEEKLY.source_cutoff)}的已有资料 · 尚无每周检查记录</span></p>`}
function weeklyHomeModule(){return `<section class="weekly-module" aria-labelledby="weekly-title"><div class="weekly-heading"><div><p class="eyebrow">${esc(activeField().name)} · 会议日历</p><h2 id="weekly-title">本周会议更新</h2></div><a href="${weeklyHref('weekly-meetings')}">查看全部会议 →</a></div>${weeklyControls('overview')}${weeklyContent()}${weeklyStatus()}</section>`}
function weeklyMeetingsPage(){return heading('每周会议列表','按会议举办日期或资料新增／变更日期分开查看。仅使用当前领域已有资料。',`<a class="button secondary" href="${weeklyHref('overview')}">返回首页</a>`)+`<section class="weekly-module">${weeklyControls('weekly-meetings')}${weeklyContent(true)}${weeklyStatus()}</section><div class="links"><a href="${url('conferences')}">进入会议研究与词云 →</a><a href="${url('sources',{group:'conference'})}">会议来源目录 →</a></div>`}
function weeklyMeetingDetail(id){const m=weeklyMeetings().find(m=>m.id===id),back=weeklyHref(pget('return_to')==='list'?'weekly-meetings':'overview');if(!m)return heading('当前领域未接入该会议','请返回会议列表，或切换到对应研究领域。')+`<a class="button secondary" href="${back}">返回会议列表</a>`;const cds=m.source_id==='CDS',rows=cds?D.topics:m.source_id==='ADA'?D.ada:[],history=WEEKLY.update_events.filter(e=>e.meeting_id===m.id),researchUrl=url('conferences',{conference:m.source_id,material:cds?'agenda':'research'});return heading(m.name,'会议资料详情 · 原始来源、已存材料与待补内容',`<a class="button secondary" href="${back}">${pget('return_to')==='list'?'返回会议列表':'返回首页'}</a>`)+`<article class="panel weekly-detail"><div class="meta-row">${pill(m.region==='domestic'?'国内':'国际')}${pill(m.priority)}</div><dl class="weekly-facts"><div><dt>举办日期</dt><dd>${esc(m.start)} — ${esc(m.end)}</dd></div><div><dt>举办地点</dt><dd>${esc(m.location)}</dd></div><div><dt>所属领域</dt><dd>${esc(activeField().name)}</dd></div><div><dt>日期依据</dt><dd>${esc(m.date_basis)}；沿用已存资料，本轮未重新访问核验。</dd></div></dl><section class="detail-section"><h2>为什么关注</h2><p>${esc(m.priority_reason)}</p><p class="meta">${esc(m.priority_basis)}。研究转化价值与公司适配在具体研究卡中分别判断。</p></section><section class="detail-section"><h2>已有资料</h2><p>${esc(m.material)}</p><div class="links"><a href="${researchUrl}">查看全部${cds?'计划议题':'关联研究'}与词云 →</a></div><ul>${rows.slice(0,4).map(r=>`<li>${cds?`<a href="${url('conferences',{conference:m.source_id,material:'agenda',q:r.code})}">${esc(r.title)}</a><span class="meta"> · ${esc(r.date)} · 计划议题</span>`:`<a href="${url('study/'+r.id,{view:'conference'})}">${esc(r.narrative?.title||r.title)}</a><span class="meta"> · ${esc(r.evidence_level||r.evidence_status)}</span>`}</li>`).join('')}</ul></section><section class="detail-section"><h2>原始来源</h2><div class="links">${externalLinks(m.links)}</div><p class="meta">来源范围：${esc(m.basis_ref)}。资料截至${esc(WEEKLY.source_cutoff)}。</p></section><section class="detail-section"><h2>待补内容</h2><ul>${m.gaps.map(g=>`<li>${esc(g)}</li>`).join('')}</ul></section><section class="detail-section"><h2>新增／更新记录</h2>${history.length?history.map(e=>`<p>${esc(e.recorded_on)} · ${esc(e.kind)}：${esc(e.summary)}</p>`).join(''):'<p>尚未建立会议新增／更新日志；首次接入已有资料不作为会议变更事件。</p>'}</section>${weeklyStatus()}</article>`}

setRoute();</script>
